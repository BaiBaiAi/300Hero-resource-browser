<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>300英雄资源浏览器</title><link rel="stylesheet" href="style.css"></head><body>
<header><div class="brand"><b>300英雄资源浏览器</b><span>全包搜索 · 关联分析 · 在线预览</span></div><label class="path"><span>游戏目录</span><input id="gameDir" readonly></label><button id="choose">选择目录…</button><button id="reload">重新扫描</button></header>
<div id="status">正在加载资源索引…</div>
<main><aside class="left"><div class="panel-title">资源检索</div><div class="search"><input id="query" placeholder="路径、文件名或关键词"><select id="category"><option>全部</option><option>模型</option><option>Live2D</option><option>贴图</option><option>技能特效</option><option>语音/音效</option><option>配置/其他</option></select><select id="pack"><option value="">全部 JMP</option></select><button id="searchBtn" class="primary">全包搜索</button></div><div class="related"><h3>角色关联搜索</h3><div><input id="hero" inputmode="numeric" placeholder="英雄编号，如 121"><button id="relatedBtn">搜索模型、皮肤等</button></div><small>按资源路径中的角色编号汇总模型、皮肤、贴图、技能特效和语音。</small></div><div class="stats" id="stats"></div></aside>
<section class="center"><div class="toolbar"><span id="resultInfo">0 项</span><button id="prev">上一页</button><span id="pageInfo">1 / 1</span><button id="next">下一页</button></div><div class="table-wrap"><table><thead><tr><th>类型</th><th>资源路径</th><th>来源包</th><th>大小</th></tr></thead><tbody id="results"></tbody></table></div></section>
<aside class="right"><div class="panel-title">资源预览</div><div id="empty">选择一个资源查看内容</div><div id="preview" hidden><div class="meta"><h2 id="title"></h2><div id="detail"></div><div class="preview-actions"><div class="file-actions"><button id="itemUp" title="上一个资源">↑ 上一项</button><button id="itemDown" title="下一个资源">↓ 下一项</button></div><div id="viewTools" class="view-tools" hidden><button id="moveLeft" title="向左移动预览">←</button><button id="moveUp" title="向上移动预览">↑</button><button id="moveDown" title="向下移动预览">↓</button><button id="moveRight" title="向右移动预览">→</button><button id="zoomOut" title="缩小预览">−</button><button id="zoomIn" title="放大预览">＋</button><button id="viewReset" title="恢复预览位置和缩放">复位</button></div></div></div><div id="visual"><div id="modelBar" hidden><select id="modelAction"></select><label>亮度 <input id="modelBrightness" type="range" min="35" max="180" value="100"></label><span id="brightnessValue">100%</span><button id="modelPlay">暂停动作</button></div><div id="transformLayer"><img id="image" hidden><canvas id="model" hidden></canvas></div><iframe id="live2d" hidden></iframe><div id="bank" hidden><select id="bankTrack" title="选择 BANK 音轨"></select><button id="bankPlay">播放所选音轨</button></div><audio id="audio" controls hidden></audio><div id="tableView" hidden></div><pre id="report" hidden></pre></div></div></aside></main>
<script src="three.min.js"></script><script src="OrbitControls.legacy.js"></script><script>window.onerror=(m,s,l,c,e)=>document.getElementById('status').textContent='脚本错误：'+m+' @'+l;window.onunhandledrejection=e=>document.getElementById('status').textContent='脚本错误：'+e.reason;</script><script src="app.js"></script></body></html>
